<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Word Sanctuary</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.progress-track { height: 6px; background: #e7e1d6; border-radius: 999px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); transition: width 0.25s ease; }
.q-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.quiz-option { position: relative; padding-right: 42px; }
.quiz-option .tick { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); opacity: 0; font-size: 18px; color: var(--gold); transition: opacity 0.15s ease; }
.quiz-option.selected .tick { opacity: 1; }
.overlay { position: fixed; inset: 0; background: rgba(23,18,31,0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
.overlay.show { display: flex; }
.overlay-card { background: #fff; border-radius: 16px; padding: 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.overlay-card .checkmark { font-size: 40px; color: var(--good); margin-bottom: 8px; }
.overlay-card h3 { margin-bottom: 4px; }
.overlay-card p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="#" id="backLink">← Back</a>
  <span class="signout" id="signoutBtn">Sign Out</span>
</div>
<div class="container">
  <h1>Quiz</h1>
  <div id="quizBody"><p class="muted">Loading...</p></div>
</div>

<div class="overlay" id="advanceOverlay">
  <div class="overlay-card">
    <div class="checkmark">✓</div>
    <h3 id="overlayTitle">Answer recorded</h3>
    <p id="overlaySubtitle">Ready for the next question?</p>
    <button id="overlayNextBtn">Next Question</button>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const quizId = params.get("id");
let currentUserId = null;
let questions = [];
let answers = {}; // questionId -> selectedIndex
let quizData = null;
let currentIndex = 0;

async function init() {
  const session = await requireAuth();
  if (!session) return;
  currentUserId = session.user.id;

  if (!quizId) { document.getElementById("quizBody").innerHTML = "<p class='muted'>Quiz not found.</p>"; return; }

  const { data: quiz } = await supabaseClient
    .from("quizzes")
    .select("*, lessons(id, course_id)")
    .eq("id", quizId)
    .single();
  quizData = quiz;
  document.getElementById("backLink").href = `lesson.html?id=${quiz.lessons.id}`;

  const { data: qs } = await supabaseClient
    .from("quiz_questions")
    .select("*")
    .eq("quiz_id", quizId)
    .order("order_index", { ascending: true });

  questions = qs || [];
  renderQuestion();
}

function renderQuestion() {
  const body = document.getElementById("quizBody");
  if (questions.length === 0) {
    body.innerHTML = "<p class='muted'>No questions in this quiz yet.</p>";
    return;
  }
  const q = questions[currentIndex];
  const pct = Math.round(((currentIndex) / questions.length) * 100);

  let optsHtml = "";
  (q.options || []).forEach((opt, oi) => {
    optsHtml += `<div class="quiz-option" data-o="${oi}">${opt}<span class="tick">✓</span></div>`;
  });

  body.innerHTML = `
    <div class="q-count">Question ${currentIndex + 1} of ${questions.length}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="card">
      <h3>${q.question}</h3>
      ${optsHtml}
    </div>
  `;

  document.querySelectorAll(".quiz-option").forEach(el => {
    el.addEventListener("click", () => {
      if (el.classList.contains("selected")) return; // already answered
      document.querySelectorAll(".quiz-option").forEach(o => o.classList.remove("selected"));
      el.classList.add("selected");
      answers[q.id] = parseInt(el.dataset.o);
      setTimeout(showAdvanceOverlay, 250);
    });
  });
}

function showAdvanceOverlay() {
  const isLast = currentIndex === questions.length - 1;
  document.getElementById("overlaySubtitle").textContent = isLast
    ? "That was the last question."
    : "Ready for the next question?";
  document.getElementById("overlayNextBtn").textContent = isLast ? "Submit Quiz" : "Next Question";
  document.getElementById("advanceOverlay").classList.add("show");
}

document.getElementById("overlayNextBtn").addEventListener("click", () => {
  document.getElementById("advanceOverlay").classList.remove("show");
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    submitQuiz();
  }
});

async function submitQuiz() {
  let correct = 0;
  questions.forEach(q => {
    if (answers[q.id] === q.correct_index) correct++;
  });
  const score = Math.round((correct / questions.length) * 100);
  const passed = score >= (quizData.pass_threshold || 70);

  await supabaseClient.from("quiz_attempts").insert({
    worker_id: currentUserId,
    quiz_id: quizId,
    score,
    correct_count: correct,
    total_questions: questions.length,
    passed
  });

  // Score is intentionally not shown to the worker — only admins see results.
  document.getElementById("quizBody").innerHTML = `
    <div class="card" style="text-align:center;">
      <h3>Quiz submitted 🙏</h3>
      <p>Thank you for completing this lesson's quiz.</p>
    </div>
    <button onclick="window.location.href='lesson.html?id=${quizData.lessons.id}'">Back to Lesson</button>
  `;
}

document.getElementById("signoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

init();
</script>
</body>
</html>
